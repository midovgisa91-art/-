<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чернильница</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#26386a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Чернильница">
<link href="https://fonts.googleapis.com/css2?family=Lora&family=PT+Serif&family=PT+Sans&family=PT+Mono&family=Marck+Script&family=Neucha&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6d0;--pg:#fbf7ea;--ink:#231c14;--mut:#8b7d68;--ac:#26386a;--sh:0 8px 28px #3a2a1a30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1611;--pg:#2a231b;--ink:#eadfca;--mut:#9c8d76;--ac:#9fb4ee;--sh:0 8px 28px #0009}}
:root[data-theme=dark]{--bg:#1a1611;--pg:#2a231b;--ink:#eadfca;--mut:#9c8d76;--ac:#9fb4ee;--sh:0 8px 28px #0009}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{position:relative;background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style","Times New Roman",serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:8px 10px;border-radius:10px;color:var(--ink)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.hide{display:none!important}
#splash{align-items:center;justify-content:center;background:var(--bg);z-index:60;transition:opacity .6s}
#splash p{margin:8px 0 0;font-size:22px;letter-spacing:.04em;opacity:0;animation:fi 1s 1.6s forwards}
#ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s .4s ease-in-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:.8}}
header,footer{display:flex;align-items:center;gap:6px;padding:10px 12px;flex:none}
header h1{margin:0;font-size:28px;font-weight:600;flex:1}
#grid{flex:1;overflow:auto;padding:12px 16px 110px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;align-content:start}
.bk{position:relative;height:200px;border-radius:4px 12px 12px 4px;background:linear-gradient(90deg,#0004 0 6px,#fff2 7px 9px,transparent 10px),var(--c);color:#fff;padding:18px 14px 14px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh);cursor:pointer;animation:up .5s backwards;overflow:hidden}
.bk b{font-size:18px;line-height:1.2;word-break:break-word;flex:1}.bk i,.bk small{opacity:.8;font-size:13px}
.bk .x{position:absolute;top:2px;right:2px;color:#fff;font-size:13px;opacity:.7}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:22px;color:var(--mut);padding:40px;font-style:italic}
#fab{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:38px;line-height:1;box-shadow:var(--sh);padding:0}
#fab:active{transform:scale(.94)}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;perspective:1200px}
.cover{width:220px;height:310px;transform-origin:left center;border-radius:4px 12px 12px 4px;box-shadow:var(--sh);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-size:24px}
#title{flex:1;min-width:0;background:none;border:0;outline:0;font-size:20px;font-weight:600;text-align:center}
#ed main{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px 0}
#stage{position:relative;--pw:min(calc(100vw - 28px),480px)}
@media(min-width:820px){#stage{--pw:min(calc((100vw - 60px)/2),440px)}}
#book{display:flex;position:relative;perspective:1600px;touch-action:pan-y}
.page{position:relative;width:var(--pw);height:calc(var(--pw)*1.3);background:linear-gradient(90deg,#0000000f,transparent 7%),var(--pg);box-shadow:var(--sh);border-radius:3px 8px 8px 3px;flex:none}
.page.empty{background:none;box-shadow:none}
.ta{font:calc(var(--pw)*.054)/1.55 var(--ff,Georgia,"Iowan Old Style",serif);color:var(--ink);background:transparent;border:0;outline:0;resize:none;padding:8% 9% 13%;width:100%;height:100%;box-sizing:border-box;overflow:hidden;display:block;touch-action:pan-y;white-space:pre-wrap;word-wrap:break-word}
#meas{position:absolute;left:0;top:0;width:var(--pw);height:calc(var(--pw)*1.3);visibility:hidden;pointer-events:none}
.num{position:absolute;bottom:4%;width:100%;text-align:center;color:var(--mut);font-size:calc(var(--pw)*.038)}
.leaf{position:absolute;z-index:5;backface-visibility:hidden;pointer-events:none}
footer{justify-content:center;flex-wrap:wrap;font-size:15px}
footer select{background:none;border:1px solid #8884;border-radius:10px;padding:6px}
#st{color:var(--mut);font-size:13px;min-width:90px;text-align:right}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--pg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0004;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:75%;overflow:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-sizing:border-box}
.sheet.on{transform:none}.sheet h2{margin:0 0 10px;font-size:20px}
.sheet input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #8886;border-radius:10px;background:transparent;font-size:17px;outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid #8886;border-radius:20px}.chip.on{background:var(--ac);color:var(--bg)}
.go{background:var(--ac);color:var(--bg);width:100%;padding:13px;font-size:17px}
.sg{border-top:1px solid #8883;padding:10px 0;font-size:15px}.sg code{white-space:pre-wrap;font-family:inherit}.sg s{opacity:.6}
.sg button{border:1px solid #8886;margin:6px 6px 0 0;padding:5px 12px}.sg .ok{background:var(--ac);color:var(--bg)}
.note{color:var(--mut);font-size:13px;margin:8px 0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>

<div id="splash" class="scr">
<svg viewBox="0 0 300 180" width="280">
<path id="ln" pathLength="1" d="M40 140 C70 110 90 160 120 135 S170 110 190 140 S240 150 262 126" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="262" cy="126" r="0" fill="var(--ink)" opacity=".5"><animate attributeName="r" from="0" to="6" begin="2.3s" dur=".4s" fill="freeze"/></circle>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.4s"/><animateMotion dur="2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .6 1" keyTimes="0;1" path="M40 140 C70 110 90 160 120 135 S170 110 190 140 S240 150 262 126"/>
<path d="M0 0 L-4 -10 C-16 -34 -36 -56 -62 -72 C-48 -48 -42 -26 -34 -8 Z" fill="var(--ac)"/></g></svg>
<p>Чернильница</p></div>

<div id="lib" class="scr hide">
<header><h1>Библиотека</h1></header>
<div id="grid"></div>
<div id="empty" class="hide">Создай свою первую историю</div>
<button id="fab" aria-label="Новая книга">+</button>
</div>

<div id="ed" class="scr hide">
<header><button id="back" aria-label="Назад">‹ Назад</button><input id="title" placeholder="Название" maxlength="80">
<button id="aib" aria-label="ИИ-помощник"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z"/><path d="M12 8v8M8.5 10l7 4M15.5 10l-7 4"/></svg></button></header>
<main><div id="stage"><div id="book"></div><textarea id="meas" class="ta" tabindex="-1" aria-hidden="true"></textarea></div></main>
<footer><button id="pv">‹</button><span id="pg"></span><button id="nx">›</button><button id="ap">+ стр.</button><button id="dp">Удалить стр.</button><select id="genre"></select><select id="font" aria-label="Шрифт"></select><span id="st"></span></footer>
<div id="ai" class="sheet"><h2>Помощник: проверка текста</h2>
<button id="chk" class="go">Проверить страницу</button><div id="res"></div>
<p class="note">Исправления только предлагаются — применяешь их ты. Адрес сервиса (POST {task,text} → {suggestions:[{original,fix,reason}]}):</p>
<input type="text" id="url" placeholder="https://…  (пусто — локальная проверка)"><br><button id="aic" style="margin-top:8px">Закрыть</button></div>
</div>

<div id="new" class="sheet"><h2>Новая книга</h2><input type="text" id="nt" placeholder="Название" maxlength="80"><div class="chips" id="chips"></div><button class="go" id="mk">Создать</button></div>

<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const G={'Роман':'#7a2f3a','Драма':'#3d4a6b','Фантастика':'#22595f','Детектив':'#4a3f35','Комедия':'#a8702a','Хоррор':'#3b2a44','Приключение':'#4b6b3a','Другое':'#5c5c5c'};
const F=[['Классический','"PT Serif",Georgia,serif'],['Книжный','"Lora",Georgia,serif'],['Прямой','"PT Sans",system-ui,"Segoe UI",sans-serif'],['Пишмашинка','"PT Mono","Courier New",monospace'],['Рукописный','"Marck Script",cursive'],['От руки','"Neucha",cursive']];
/* ===== storage (localStorage + memory fallback) ===== */
const Store={mem:{},get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return this.mem[k]??d}},set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* ===== book model ===== */
const Books={list:Store.get('qb.books',[]),save(){Store.set('qb.books',this.list)},
 create(t,g){const b={id:Date.now().toString(36),title:t||'Без названия',genre:g,created:Date.now(),updated:Date.now(),pages:['','']};this.list.unshift(b);this.save();return b},
 remove(id){this.list=this.list.filter(b=>b.id!=id);this.save()}};
/* ===== UI animations ===== */
const Anim={openBook(b,cb){const o=h('div','ov'),c=h('div','cover',b.title);c.style.background=G[b.genre]||G['Другое'];o.append(c);document.body.append(o);
 c.animate([{transform:'rotateY(0)'},{transform:'rotateY(-160deg)',opacity:.1}],{duration:800,easing:'ease-in-out',fill:'forwards',delay:150});
 setTimeout(()=>{cb();o.animate([{opacity:1},{opacity:0}],{duration:300}).onfinish=()=>o.remove()},800)},
 two(btn,fn){if(btn.dataset.a){fn();return}btn.dataset.a=1;const t=btn.textContent;btn.textContent='Точно?';setTimeout(()=>{delete btn.dataset.a;btn.textContent=t},2000)}};
/* ===== AI helper (swap provider here; more tasks can be added later) ===== */
const AI={cfg:Store.get('qb.ai',{url:''}),
 async proofread(text){if(this.cfg.url){try{const r=await fetch(this.cfg.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'proofread',text,lang:'ru'})});return{list:(await r.json()).suggestions||[],src:'сервис'}}catch(e){return{list:this.local(text),src:'локально (сервис недоступен)'}}}
  return{list:this.local(text),src:'локально (демо-правила)'}},
 local(t){const s=[],R=[[/(\S+)\s+\1(?=[\s.,!?]|$)/gi,m=>m[1],'повтор слова'],[/ {2,}/g,()=>' ','двойной пробел'],[/\s+[,.!?;:]/g,m=>m[0].trim(),'пробел перед знаком'],[/[,;:][^\s\d]/g,m=>m[0]+' '+m[1],'нет пробела после знака'],[/[.!?]\s+[а-яёa-z]/g,m=>m[0]+m.slice(1,-1)+m.slice(-1).toUpperCase(),'предложение с маленькой буквы']];
  R.forEach(([re,f,why])=>{for(const m of t.matchAll(re))s.push({original:m[0],fix:f(m),reason:why})});return s.slice(0,30)}};
/* ===== editor ===== */
const Editor={b:null,idx:0,cur:0,spread:1,busy:false,t:null,
 open(b){this.b=b;this.idx=this.cur=0;$('#lib').classList.add('hide');$('#ed').classList.remove('hide');$('#title').value=b.title;$('#genre').value=b.genre;$('#st').textContent='';this.render();this.setFont(false)},
 async setFont(force){const b=this.b,f=F.find(x=>x[0]==b.font)||F[0];$('#stage').style.setProperty('--ff',f[1]);$('#font').value=f[0];
  try{await Promise.race([document.fonts.load('16px '+f[1].split(',')[0],'Аа'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  if(this.b!==b)return;const ch=this.reflow(0);if(ch||force){this.render();this.touch()}},
 close(){this.flush();this.b=null;$('#ed').classList.add('hide');$('#lib').classList.remove('hide');Library.render()},
 q(i){return $('#book').querySelector('[data-i="'+i+'"]')},
 render(){const p=this.b.pages;this.spread=innerWidth>=820?2:1;this.idx=Math.max(0,this.idx-this.idx%this.spread);const bk=$('#book');bk.innerHTML='';
  for(let k=0;k<this.spread;k++){const i=this.idx+k,pg=h('div','page');if(i>=p.length){pg.classList.add('empty');bk.append(pg);continue}
   const ta=h('textarea','ta');ta.value=p[i];ta.dataset.i=i;ta.placeholder=i?'':'Начни писать…';ta.oninput=()=>this.input(ta,i);pg.append(ta,h('div','num',i+1));bk.append(pg)}
  if(this.cur<this.idx||this.cur>=this.idx+this.spread)this.cur=this.idx;
  $('#pg').textContent=(this.idx+1)+(this.spread>1&&this.idx+1<p.length?'–'+(this.idx+2):'')+' / '+p.length},
 input(ta,i){const p=this.b.pages;p[i]=ta.value;let c=ta.selectionStart;
  if(this.reflow(i)){const L=p[i].length;if(c>L){c-=L;this.sync();this.goto(i+1,c)}else{ta.value=p[i];ta.setSelectionRange(c,c);this.sync()}}this.touch()},
 reflow(i){const p=this.b.pages,m=$('#meas'),over=()=>m.scrollHeight>m.clientHeight+1;let ch=false;
  for(;i<p.length;i++){m.value=p[i];if(!over())break;let t=p[i],cut='';
   while(t&&over()){const x=(t.match(/\s+$/)||t.match(/\S+$/))[0];cut=x+cut;t=t.slice(0,-x.length);m.value=t}
   p[i]=t;if(i+1>=p.length)p.push('');p[i+1]=cut+p[i+1];ch=true}return ch},
 sync(){$('#book').querySelectorAll('textarea').forEach(t=>{const v=this.b.pages[+t.dataset.i];if(t.value!==v)t.value=v});$('#pg').textContent=$('#pg').textContent.replace(/\/ \d+$/,'/ '+this.b.pages.length)},
 goto(i,c){const t=this.q(i);if(t){t.focus();t.setSelectionRange(c,c);this.cur=i;return}
  this.turn(1,i,()=>{const t=this.q(i);if(t){t.focus();t.setSelectionRange(c,c);this.cur=i}})},
 turn(dir,ni,after){if(this.busy)return;const bk=$('#book'),sl=[...bk.querySelectorAll('.page')],s=sl[dir>0?sl.length-1:0],r=s.getBoundingClientRect(),br=bk.getBoundingClientRect();
  const ta=s.querySelector('textarea'),leaf=h('div','page leaf');leaf.style.cssText='left:'+(r.left-br.left)+'px;top:'+(r.top-br.top)+'px;transform-origin:'+(dir>0?'left':'right')+' center';
  leaf.append(h('div','ta',ta?ta.value:''),h('div','num',ta?+ta.dataset.i+1:''));
  this.busy=true;this.idx=ni;this.render();bk.append(leaf);after&&after();
  leaf.animate([{transform:'rotateY(0)',filter:'brightness(1)'},{transform:'rotateY('+(dir>0?-95:95)+'deg)',filter:'brightness(.75)',opacity:.3}],{duration:520,easing:'ease-in'}).onfinish=()=>{leaf.remove();this.busy=false}},
 flip(dir){const p=this.b.pages,n=this.idx+dir*this.spread;if(n<0)return;if(n>=p.length){if(!p[p.length-1].trim())return;p.push('');this.touch()}this.turn(dir,n)},
 add(){const p=this.b.pages,pos=this.idx+this.spread;p.splice(pos,0,'');this.touch();this.turn(1,pos,()=>{const t=this.q(pos);t&&(t.focus(),this.cur=pos)})},
 del(){const p=this.b.pages;if(p.length<=1)p[0]='';else p.splice(this.cur,1);this.idx=Math.min(this.idx,p.length-1);this.cur=this.idx;this.touch();this.render()},
 apply(o,f){const p=this.b.pages,i=this.cur;p[i]=p[i].replace(o,f);this.reflow(i);this.sync();this.touch()},
 touch(){this.b.updated=Date.now();$('#st').textContent='…';clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),400)},
 flush(){clearTimeout(this.t);Books.save();const s=$('#st');s.textContent='✓ Сохранено';s.animate([{opacity:1},{opacity:.4}],{duration:900})},
 init(){const bk=$('#book');let sx=0,sy=0;bk.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  bk.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)this.flip(dx<0?1:-1)});
  bk.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.i)this.cur=+e.target.dataset.i});
  $('#pv').onclick=()=>this.flip(-1);$('#nx').onclick=()=>this.flip(1);$('#ap').onclick=()=>this.add();$('#dp').onclick=e=>Anim.two(e.target,()=>this.del());
  $('#back').onclick=()=>this.close();
  $('#title').oninput=e=>{this.b.title=e.target.value||'Без названия';this.touch()};
  $('#genre').onchange=e=>{this.b.genre=e.target.value;this.touch()};
  Object.keys(G).forEach(g=>$('#genre').append(new Option(g,g)));
  F.forEach(f=>$('#font').append(new Option(f[0],f[0])));$('#font').onchange=e=>{this.b.font=e.target.value;this.setFont(true)};
  $('#aib').onclick=()=>$('#ai').classList.add('on');$('#aic').onclick=()=>$('#ai').classList.remove('on');
  $('#url').value=AI.cfg.url||'';$('#url').onchange=e=>{AI.cfg.url=e.target.value.trim();Store.set('qb.ai',AI.cfg)};
  $('#chk').onclick=async()=>{const res=$('#res');res.textContent='Проверяю…';const text=this.b.pages[this.cur]||'';
   if(!text.trim()){res.textContent='На странице нет текста.';return}
   const {list,src}=await AI.proofread(text);res.innerHTML='';res.append(h('p','note','Проверка: '+src));
   if(!list.length)res.append(h('p','','Ошибок не найдено ✓'));
   list.forEach(s=>{const d=h('div','sg');d.append(h('div','',(s.reason||'Возможное исправление')+':'));const c=h('code');c.append(h('s','',s.original),' → ',h('b','',s.fix));d.append(c,h('br'));
    const ok=h('button','ok','Применить'),no=h('button','','Пропустить');ok.onclick=()=>{this.apply(s.original,s.fix);d.remove()};no.onclick=()=>d.remove();d.append(ok,no);res.append(d)})};
  addEventListener('resize',()=>{if(this.b&&!this.busy&&this.spread!==(innerWidth>=820?2:1))this.render()})}};
/* ===== library ===== */
const Library={sel:'Роман',
 render(){const g=$('#grid');g.innerHTML='';$('#empty').classList.toggle('hide',!!Books.list.length);
  Books.list.forEach((b,n)=>{const c=h('div','bk');c.style.setProperty('--c',G[b.genre]||G['Другое']);c.style.animationDelay=n*60+'ms';c.append(h('b','',b.title),h('i','',b.genre),h('small','',b.pages.length+' стр.'));
   const x=h('button','x','Удалить');x.onclick=e=>{e.stopPropagation();Anim.two(x,()=>{Books.remove(b.id);this.render()})};c.append(x);c.onclick=()=>Anim.openBook(b,()=>Editor.open(b));g.append(c)})},
 init(){const ch=$('#chips');Object.keys(G).slice(0,7).forEach(k=>{const c=h('button','chip'+(k==this.sel?' on':''),k);c.onclick=()=>{this.sel=k;ch.querySelectorAll('.chip').forEach(e=>e.classList.toggle('on',e==c))};ch.append(c)});
  $('#fab').onclick=()=>{$('#nt').value='';$('#new').classList.add('on');setTimeout(()=>$('#nt').focus(),300)};
  $('#mk').onclick=()=>{$('#new').classList.remove('on');const b=Books.create($('#nt').value.trim(),this.sel);Anim.openBook(b,()=>Editor.open(b))};
  this.render()}};
/* ===== settings/lifecycle & boot ===== */
const flushAll=()=>{Editor.b?Editor.flush():Books.save()};
addEventListener('pagehide',flushAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
Editor.init();Library.init();
let done=false;const endSplash=()=>{if(done)return;done=true;const s=$('#splash');s.style.opacity=0;$('#lib').classList.remove('hide');$('#lib').animate([{opacity:0},{opacity:1}],{duration:600});setTimeout(()=>s.remove(),650)};
$('#splash').onclick=endSplash;setTimeout(endSplash,3100);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
